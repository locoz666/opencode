worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  resolver ${DNS_RESOLVER} ipv6=off valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $backend opencode.default.svc.cluster.local:4096;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /pty/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://$backend;
    }

    location ~ ^/(global|auth|project|session|permission|question|provider|config|mcp|experimental|tui|instance)(/|$) {
      proxy_pass http://$backend;
    }

    location ~ ^/(find|file)(/|$) {
      proxy_pass http://$backend;
    }

    location ~ ^/(path|command|agent|vcs|lsp|event)$ {
      proxy_pass http://$backend;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
